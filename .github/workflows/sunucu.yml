# v1 – 2026-10-16: Karekod Sunucu EXE'si Windows'ta derlenip Releases'a konur
name: Sunucu EXE derle

on:
  push:
    branches: [ main ]
    paths:
      - "karekod_sunucu/**"
      - ".github/workflows/sunucu.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: karekod_sunucu
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Kütüphaneler
        run: pip install flask werkzeug "qrcode[pil]" pillow pystray pyperclip keyboard pyinstaller

      - name: Söz dizimi kontrolü
        run: python -c "import ast;ast.parse(open('karekod_sunucu.py',encoding='utf-8').read());print('ast ok')"

      - name: EXE derle
        run: python -m PyInstaller --noconfirm --noconsole --onefile --icon=icon.png --add-data "icon.png;." -n Karekod_Sunucu karekod_sunucu.py

      - name: Sürüm sayfasına koy
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sunucu-${{ github.run_number }}
          name: Karekod Sunucu (derleme ${{ github.run_number }})
          body: "PC sunucusu. Karekod_Sunucu.exe dosyasını indirip çalıştırın (yönetici izni ister). Commit: ${{ github.sha }}"
          make_latest: false
          files: karekod_sunucu/dist/Karekod_Sunucu.exe
